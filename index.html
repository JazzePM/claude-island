<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Claude Island</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f7;
    --muted: #8e8e93;
    --faint: #3a3a3c;
    --track: #1c1c1e;
    --brand: #d97757;
    --ok: #30d158;
    --warn: #ffd60a;
    --high: #ff9f0a;
    --crit: #ff453a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Storlek och hörnradie styrs av fjäderfysiken i skriptet. */
  #island {
    position: relative;
    width: 220px;
    height: 36px;
    border-radius: 18px;
    background: var(--bg);
    overflow: hidden;
    cursor: pointer;
    will-change: width, height;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 12px 32px rgba(0,0,0,.35);
    transform: translateZ(0);
  }
  #island.open { cursor: default; }

  /* Båda lägena ligger centrerade med fast bredd, så ön växer symmetriskt runt dem. */
  .compact, .expanded {
    position: absolute; top: 0; left: 50%;
    will-change: opacity, transform, filter;
  }

  /* ---------- kompakt läge ---------- */
  .compact {
    width: 220px; height: 36px;
    transform: translateX(-50%);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 10px;
  }
  .side { display: flex; align-items: center; gap: 7px; }
  .num {
    font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .tag { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .spark { width: 16px; height: 16px; flex: none; }
  .ring { width: 18px; height: 18px; transform: rotate(-90deg); flex: none; }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bg { stroke: var(--faint); }
  .ring .fg { stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1), stroke .3s; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--crit); display: none; }
  .dot.show { display: block; }

  /* ---------- expanderat läge ---------- */
  .expanded {
    width: 420px;
    padding: 18px 22px 20px;
    opacity: 0;
    transform: translateX(-50%);
    transform-origin: top center;
    pointer-events: none;
  }
  #island.open .expanded { pointer-events: auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  header .spark { width: 22px; height: 22px; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .plan {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--brand); background: rgba(217,119,87,.14);
    padding: 3px 7px; border-radius: 6px;
  }
  header .spacer { flex: 1; }
  .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta.err { color: var(--high); }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 50%;
    border: 0; background: var(--track); color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--faint); color: var(--fg); }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rows { display: flex; flex-direction: column; gap: 14px; }
  .group-label {
    font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 4px 0 -6px;
  }
  .row .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .row .name { font-size: 13px; font-weight: 600; }
  .row .hint { font-size: 11px; color: var(--muted); }
  .row .pct {
    margin-left: auto; font-size: 20px; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .row .pct small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 1px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar i {
    display: block; height: 100%; border-radius: 3px;
    transition: width .8s cubic-bezier(.2,.8,.2,1), background .3s;
  }
  .row .reset { margin-top: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .reset b { color: var(--fg); font-weight: 500; }
  .row.empty .pct, .row.empty .name { color: var(--muted); }

  .msg { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* ---------- lossad ö ---------- */
  #island.detached:not(.open) { cursor: grab; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  /* ---------- projektdocka ---------- */
  #stage { position: relative; }
  #dock {
    position: absolute; top: 0; left: calc(100% + 8px);
    height: 36px; padding: 0 9px; gap: 9px;
    display: flex; align-items: center;
    background: var(--bg); border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 12px 32px rgba(0,0,0,.35);
    transform-origin: left center;
    opacity: 0; pointer-events: none;
    will-change: transform, opacity, filter;
  }
  #dock.live { pointer-events: auto; }
  .proj {
    position: relative; width: 24px; height: 24px; flex: none;
    border: 0; padding: 0; background: none; cursor: pointer;
    transition: transform .3s cubic-bezier(.3,1.5,.5,1);
  }
  .proj:hover { transform: scale(1.16); }
  .proj:active { transform: scale(.9); transition-duration: .1s; }
  .proj .in { display: block; width: 24px; height: 24px; will-change: transform, opacity; }
  .proj img, .proj .mono {
    width: 24px; height: 24px; border-radius: 7px; display: block; object-fit: cover;
  }
  .proj .mono {
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff; letter-spacing: -.02em;
  }
  .proj .badge {
    position: absolute; right: -4px; bottom: -4px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #2c2c2e; box-shadow: 0 0 0 2px var(--bg);
    display: grid; place-items: center; color: var(--fg);
  }
  .proj .badge svg { width: 7px; height: 7px; }
  .proj.launching .in { animation: launch .6s cubic-bezier(.3,1.4,.5,1); }
  @keyframes launch { 30% { transform: scale(.8); } 60% { transform: scale(1.15) translateY(-2px); } }

  #dock-label {
    position: absolute; top: 44px;
    transform: translateX(-50%) translateY(-4px);
    background: var(--bg); color: var(--fg);
    font-size: 11px; font-weight: 600; white-space: nowrap;
    padding: 4px 10px; border-radius: 10px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease, transform .3s cubic-bezier(.3,1.4,.5,1), left .25s cubic-bezier(.3,1.2,.5,1);
  }
  #dock-label.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #dock-label span { color: var(--muted); font-weight: 500; }

  /* ---------- redigera-knapp i dockan ---------- */
  .proj.edit .in {
    display: grid; place-items: center; border-radius: 7px;
    background: #1c1c1e; color: var(--muted);
  }
  .proj.edit:hover .in { color: var(--fg); background: #2c2c2e; }
  .proj.edit svg { width: 13px; height: 13px; }
  .dock-sep { width: 1px; height: 18px; background: #2c2c2e; flex: none; margin: 0 -2px; }

  /* ---------- projektvy (välj projekt i dockan) ---------- */
  #picker[hidden], #rows[hidden], .icon-btn[hidden] { display: none; }
  #pick-search {
    width: 100%; margin-bottom: 10px;
    background: var(--track); color: var(--fg);
    border: 0; border-radius: 10px; padding: 8px 12px;
    font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    outline: none;
  }
  #pick-search::placeholder { color: var(--muted); }
  #pick-search:focus { box-shadow: inset 0 0 0 1px #48484a; }
  #pick-list {
    max-height: 252px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px;
    margin: 0 -8px; padding: 0 4px;
  }
  #pick-list::-webkit-scrollbar { width: 6px; }
  #pick-list::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 3px; }
  .pick-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 10px; cursor: pointer;
    transition: background .12s;
  }
  .pick-row:hover { background: var(--track); }
  .pick-row.disabled { cursor: default; }
  .pick-row.disabled .tile, .pick-row.disabled .txt { opacity: .4; }
  .pick-row .tile, .pick-row .tile img, .pick-row .tile .mono {
    width: 24px; height: 24px; border-radius: 7px; flex: none; display: block; object-fit: cover;
  }
  .pick-row .tile .mono { display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
  .pick-row .txt { min-width: 0; flex: 1; }
  .pick-row .nm { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick-row .kd { font-size: 11px; color: var(--muted); }
  .switch {
    position: relative; width: 34px; height: 20px; border-radius: 10px; flex: none;
    background: #3a3a3c; transition: background .2s;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .3s cubic-bezier(.3,1.4,.5,1);
  }
  .pick-row.on .switch { background: var(--ok); }
  .pick-row.on .switch::after { transform: translateX(14px); }
  .pick-empty { font-size: 12px; color: var(--muted); padding: 10px 8px; }
  .pick-hint { font-size: 11px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
  <div id="stage">
  <div id="island" role="button" aria-expanded="false" aria-label="Claude-förbrukning">
    <div class="compact" id="compact">
      <div class="side">
        <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><g stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></g></svg>
        <span class="num" id="c-session">–</span>
        <span class="tag">5h</span>
      </div>
      <div class="side">
        <span class="dot" id="c-dot"></span>
        <span class="tag">v</span>
        <span class="num" id="c-week">–</span>
        <svg class="ring" viewBox="0 0 20 20" aria-hidden="true">
          <circle class="bg" cx="10" cy="10" r="7"/>
          <circle class="fg" id="c-ring" cx="10" cy="10" r="7" stroke-dasharray="43.98" stroke-dashoffset="43.98"/>
        </svg>
      </div>
    </div>

    <div class="expanded" id="expanded">
      <header>
        <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><g stroke="var(--brand)" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></g></svg>
        <h1 id="title">Claude-förbrukning</h1>
        <span class="plan" id="plan" hidden></span>
        <span class="spacer"></span>
        <span class="meta" id="meta"></span>
        <button class="icon-btn" id="projects-btn" title="Välj projekt i dockan" aria-label="Välj projekt i dockan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
        </button>
        <button class="icon-btn" id="minimize" title="Minimera till systemfältet" aria-label="Minimera till systemfältet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
        </button>
        <button class="icon-btn" id="refresh" title="Uppdatera" aria-label="Uppdatera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </header>
      <div class="rows" id="rows"><p class="msg">Hämtar förbrukning…</p></div>
      <div id="picker" hidden>
        <input id="pick-search" type="text" placeholder="Sök projekt…" autocomplete="off" spellcheck="false">
        <div id="pick-list"></div>
        <p class="pick-hint" id="pick-hint"></p>
      </div>
    </div>
  </div>
  <div id="dock" aria-label="Projekt"></div>
  <div id="dock-label"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const islandEl = $('island');
  const compactEl = $('compact');
  const expandedEl = $('expanded');
  const dockEl = $('dock');
  const labelEl = $('dock-label');
  let state = null;

  /* ================= fjäderfysik =================
     Varje mått är en dämpad fjäder. Byter man mål mitt i en rörelse
     behålls farten, så animationen kan avbrytas utan ryck. */
  const C_W = 220, C_H = 36, O_W = 420, HOVER = 1.035;
  const SPRING_OPEN  = { k: 230, c: 22 };  // lite studs, som Dynamic Island
  const SPRING_CLOSE = { k: 300, c: 30 };  // stramare på vägen hem
  const SPRING_HOVER = { k: 420, c: 30 };

  function spring(v) { return { x: v, v: 0, to: v, p: SPRING_OPEN }; }
  const W = spring(C_W), H = spring(C_H);
  const D = spring(0); // dockan: 0 = gömd, 1 = framme
  D.p = { k: 320, c: 26 };
  let isOpen = false, hovering = false, raf = 0, lastT = 0;

  function stepSpring(s, dt) {
    const a = -s.p.k * (s.x - s.to) - s.p.c * s.v;
    s.v += a * dt;
    s.x += s.v * dt;
  }
  const settled = (s) => Math.abs(s.x - s.to) < 0.05 && Math.abs(s.v) < 0.05;

  function frame(t) {
    const dt = Math.min((t - lastT) / 1000 || 0, 1 / 30);
    lastT = t;
    // Små delsteg ger stabil fysik oavsett bildfrekvens.
    const n = Math.max(1, Math.ceil(dt / (1 / 240)));
    for (let i = 0; i < n; i++) { stepSpring(W, dt / n); stepSpring(H, dt / n); stepSpring(D, dt / n); }
    paint();
    if (settled(W) && settled(H) && settled(D)) {
      W.x = W.to; H.x = H.to; D.x = D.to; W.v = H.v = D.v = 0;
      paint();
      raf = 0;
    } else {
      raf = requestAnimationFrame(frame);
    }
  }
  function kick() {
    if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); }
  }

  const clamp01 = (n) => Math.max(0, Math.min(1, n));
  function paint() {
    // p: 0 = kompakt, 1 = helt öppen (kan översvänga lite).
    const p = (W.x - C_W) / (O_W - C_W);
    islandEl.style.width = W.x + 'px';
    islandEl.style.height = H.x + 'px';
    islandEl.style.borderRadius = Math.min(H.x / 2, 18 + clamp01(p) * 14) + 'px';

    // Kompakt innehåll försvinner tidigt och suddas ut.
    const co = clamp01(1 - p * 3.2);
    compactEl.style.opacity = co;
    compactEl.style.filter = co < 1 ? `blur(${(1 - co) * 6}px)` : '';
    compactEl.style.transform = `translateX(-50%) scale(${1 + clamp01(p) * 0.12})`;

    // Expanderat innehåll tonar in när ön nästan har nått sin storlek.
    const eo = clamp01((p - 0.35) / 0.55);
    expandedEl.style.opacity = eo;
    expandedEl.style.filter = eo < 1 ? `blur(${(1 - eo) * 8}px)` : '';
    expandedEl.style.transform = `translateX(-50%) translateY(${(1 - eo) * -6}px) scale(${0.94 + eo * 0.06})`;

    // Dockan glider ut från öns kant; ikonerna kommer en i taget.
    const d = D.x;
    dockEl.style.opacity = clamp01(d * 1.6);
    dockEl.style.filter = d < 1 ? `blur(${(1 - clamp01(d)) * 6}px)` : '';
    dockEl.style.transform = `translateX(${(1 - d) * -30}px) scale(${0.45 + 0.55 * d})`;
    dockEl.querySelectorAll('.in').forEach((el, i) => {
      const q = clamp01((d - i * 0.07) * 2.2);
      el.style.opacity = q;
      el.style.transform = `scale(${0.55 + 0.45 * q})`;
    });
  }

  function setTargets() {
    const params = isOpen ? SPRING_OPEN : hovering ? SPRING_HOVER : SPRING_CLOSE;
    W.p = H.p = params;
    if (isOpen) {
      W.to = O_W;
      H.to = expandedEl.offsetHeight;
    } else {
      const s = hovering ? HOVER : 1;
      W.to = C_W * s;
      H.to = C_H * s;
    }
    kick();
  }

  /* ================= data ================= */
  const clamp = (n) => Math.max(0, Math.min(100, n));
  const pctOf = (w) => (w && typeof w.utilization === 'number') ? clamp(w.utilization) : null;
  function level(p) {
    if (p == null) return 'var(--faint)';
    if (p >= 90) return 'var(--crit)';
    if (p >= 75) return 'var(--high)';
    if (p >= 50) return 'var(--warn)';
    return 'var(--ok)';
  }
  const fmtPct = (p) => p == null ? '–' : Math.round(p) + '%';

  const dayFmt = new Intl.DateTimeFormat('sv-SE', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const timeFmt = new Intl.DateTimeFormat('sv-SE', { hour: '2-digit', minute: '2-digit' });

  function untilText(iso) {
    if (!iso) return null;
    const t = new Date(iso).getTime();
    if (isNaN(t)) return null;
    let mins = Math.max(0, Math.round((t - Date.now()) / 60000));
    const d = Math.floor(mins / 1440); mins -= d * 1440;
    const h = Math.floor(mins / 60); const m = mins % 60;
    let rel;
    if (d > 0) rel = `${d} d ${h} h`;
    else if (h > 0) rel = `${h} h ${m} min`;
    else rel = `${m} min`;
    const sameDay = new Date(t).toDateString() === new Date().toDateString();
    const abs = sameDay ? `idag ${timeFmt.format(t)}` : dayFmt.format(t);
    return { rel, abs };
  }

  const titleCase = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // Plockar ut fönstren ur API-svaret. Främst från listan `limits`
  // (session / weekly_all / weekly_scoped per modell), annars de äldre fälten.
  function windows(data) {
    const byFable = (a, b) => (b.key.includes('fable') - a.key.includes('fable')) || a.name.localeCompare(b.name);
    const limits = Array.isArray(data?.limits) ? data.limits : null;
    if (limits && limits.length) {
      const w = (l) => l ? { utilization: l.percent, resets_at: l.resets_at } : null;
      const models = limits
        .filter((l) => l.kind === 'weekly_scoped')
        .map((l) => {
          const name = l.scope?.model?.display_name || l.scope?.surface || 'Övrigt';
          return { key: name.toLowerCase(), name, w: w(l) };
        })
        .sort(byFable);
      if (!models.some((m) => m.key.includes('fable'))) models.unshift({ key: 'fable', name: 'Fable', w: null });
      return {
        session: w(limits.find((l) => l.kind === 'session')) || data.five_hour || null,
        week: w(limits.find((l) => l.kind === 'weekly_all')) || data.seven_day || null,
        models,
      };
    }
    const models = Object.keys(data || {})
      .filter((k) => /^seven_day_/.test(k) && k !== 'seven_day_oauth_apps')
      .filter((k) => data[k] && typeof data[k] === 'object' && 'utilization' in data[k])
      .map((k) => ({ key: k, name: titleCase(k.replace('seven_day_', '').replace(/_/g, ' ')), w: data[k] }))
      .sort(byFable);
    if (!models.some((m) => m.key.includes('fable'))) models.unshift({ key: 'fable', name: 'Fable', w: null });
    return { session: data?.five_hour || null, week: data?.seven_day || null, models };
  }

  const ERRORS = {
    nocreds: 'Hittar inga Claude-inloggningsuppgifter. Logga in i Claude Code först.',
    expired: 'Inloggningen har gått ut – starta Claude Code en gång så förnyas den.',
    ratelimited: 'För många anrop just nu – försöker igen strax.',
    offline: 'Ingen anslutning – visar senaste kända värden.',
  };

  function rowHTML(name, hint, w) {
    const p = pctOf(w);
    const u = untilText(w?.resets_at);
    const reset = p == null
      ? 'Ingen data för den här perioden'
      : u ? `Återställs om <b>${u.rel}</b> · ${u.abs}` : 'Ingen aktiv period – startar vid nästa användning';
    return `
      <div class="row${p == null ? ' empty' : ''}">
        <div class="top">
          <span class="name">${name}</span>
          ${hint ? `<span class="hint">${hint}</span>` : ''}
          <span class="pct">${p == null ? '–' : Math.round(p)}<small>${p == null ? '' : '%'}</small></span>
        </div>
        <div class="bar"><i style="width:${p ?? 0}%;background:${level(p)}"></i></div>
        <div class="reset">${reset}</div>
      </div>`;
  }

  function render() {
    const s = state || {};
    const { session, week, models } = windows(s.data);

    const sp = pctOf(session), wp = pctOf(week);
    $('c-session').textContent = fmtPct(sp);
    $('c-session').style.color = sp >= 75 ? level(sp) : '';
    $('c-week').textContent = fmtPct(wp);
    const ring = $('c-ring');
    ring.style.stroke = level(wp);
    ring.style.strokeDashoffset = 43.98 * (1 - (wp ?? 0) / 100);
    $('c-dot').classList.toggle('show', !!s.error && !s.data);

    const plan = $('plan');
    plan.hidden = !s.plan;
    plan.textContent = s.plan || '';

    // I projektvyn visar meta-fältet antal valda projekt; rör det inte här.
    const meta = view === 'usage' ? $('meta') : document.createElement('span');
    meta.classList.toggle('err', !!s.error);
    meta.textContent = s.error
      ? (s.error === 'offline' ? 'offline' : 'fel')
      : s.fetchedAt ? timeFmt.format(s.fetchedAt) : '';
    meta.title = s.error ? (ERRORS[s.error] || s.error) : 'Senast uppdaterad';

    const rows = $('rows');
    if (!s.data) {
      rows.innerHTML = `<p class="msg">${s.error ? (ERRORS[s.error] || 'Kunde inte hämta förbrukning (' + s.error + ').') : 'Hämtar förbrukning…'}</p>`;
    } else {
      let html = rowHTML('Session', '5-timmarsfönster', session);
      html += `<div class="group-label">Veckogräns</div>`;
      html += rowHTML('Alla modeller', '', week);
      for (const m of models) html += rowHTML(m.name, '', m.w);
      if (s.error && ERRORS[s.error]) html += `<p class="msg">${ERRORS[s.error]}</p>`;
      rows.innerHTML = html;
    }
    updateTray(session, week, models);

    // Om innehållet ändrar höjd medan ön är öppen fjädrar den mjukt dit.
    if (isOpen) setTargets();
  }

  /* ================= systemfältet =================
     En liten färgad bricka med sessionsprocenten, ritad i 16 px och 32 px. */
  const LEVEL_HEX = { ok: '#30d158', warn: '#ffd60a', high: '#ff9f0a', crit: '#ff453a', none: '#636366' };
  function levelHex(p) {
    if (p == null) return LEVEL_HEX.none;
    if (p >= 90) return LEVEL_HEX.crit;
    if (p >= 75) return LEVEL_HEX.high;
    if (p >= 50) return LEVEL_HEX.warn;
    return LEVEL_HEX.ok;
  }
  function drawTray(text, color, scale) {
    const s = 16 * scale;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(0, 0, s, s, 4 * scale);
    ctx.fill();
    const size = text.length >= 3 ? 0.5 : text.length === 2 ? 0.68 : 0.8;
    ctx.font = `700 ${Math.round(s * size)}px "Segoe UI Variable Display", "Segoe UI", sans-serif`;
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, s / 2, s / 2 + s * 0.04);
    return c.toDataURL('image/png');
  }
  let lastTrayKey = '';
  function updateTray(session, week, models) {
    const sp = pctOf(session);
    const text = sp == null ? '–' : String(Math.round(sp));
    const color = levelHex(sp);
    const parts = [`Session ${fmtPct(sp)}`];
    const u = untilText(session?.resets_at);
    if (sp != null && u) parts[0] += ` (återst. ${u.rel})`;
    parts.push(`Vecka ${fmtPct(pctOf(week))}`);
    for (const m of models) if (m.w) parts.push(`${m.name} ${fmtPct(pctOf(m.w))}`);
    const tooltip = ('Claude · ' + parts.join(' · ')).slice(0, 127);
    const key = text + color + tooltip;
    if (key === lastTrayKey) return;
    lastTrayKey = key;
    window.bridge.setTray([1, 2].map((scale) => ({ scale, url: drawTray(text, color, scale) })), tooltip);
  }

  /* ================= projektdocka ================= */
  const KIND = {
    web: { label: 'webb', svg: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/>' },
    app: { label: 'app', svg: '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18h2"/>' },
    desktop: { label: 'skrivbordsapp', svg: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>' },
    node: { label: 'node', svg: '<path d="M9 4C7 4 7 6 7 8s-1 4-3 4c2 0 3 2 3 4s0 4 2 4M15 4c2 0 2 2 2 4s1 4 3 4c-2 0-3 2-3 4s0 4-2 4"/>' },
  };
  let projects = [];
  let dockShown = false, hoverIsland = false, hoverDock = false;
  let showTimer = 0, hideTimer = 0;
  let drag = null, justDragged = false, detached = false;

  function hashHue(s) {
    let h = 0;
    for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return h % 360;
  }
  function initials(name) {
    const w = name.split(/\s+/).filter(Boolean);
    return w.length > 1 ? (w[0][0] + w[1][0]).toUpperCase() : name.slice(0, 2).replace(/^./, (c) => c.toUpperCase());
  }

  // Projektets ikon, eller en färgad ruta med initialer om ikon saknas.
  function makeTile(p) {
    if (p.icon) {
      const img = document.createElement('img');
      img.src = p.icon;
      img.alt = '';
      img.draggable = false;
      return img;
    }
    const mono = document.createElement('span');
    mono.className = 'mono';
    const hue = hashHue(p.name);
    mono.style.background = `linear-gradient(135deg, hsl(${hue} 65% 56%), hsl(${(hue + 35) % 360} 70% 42%))`;
    mono.textContent = initials(p.name);
    return mono;
  }

  function buildDock() {
    dockEl.textContent = '';
    // Typmärket visas bara när projekt delar förled (t.ex. LILO App / LILO Portal),
    // annars är ikonerna rena.
    const shown = projects.filter((p) => p.selected).slice(0, 8);
    const prefix = (p) => p.name.split(/\s+/)[0].toLowerCase();
    const count = {};
    for (const p of shown) count[prefix(p)] = (count[prefix(p)] || 0) + 1;
    for (const p of shown) {
      const btn = document.createElement('button');
      btn.className = 'proj';
      btn.setAttribute('aria-label', p.name);
      const inner = document.createElement('span');
      inner.className = 'in';
      inner.appendChild(makeTile(p));
      if (p.kind && KIND[p.kind] && count[prefix(p)] > 1) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${KIND[p.kind].svg}</svg>`;
        inner.appendChild(b);
      }
      btn.appendChild(inner);
      btn.addEventListener('mouseenter', () => showLabel(btn, p));
      btn.addEventListener('mouseleave', hideLabel);
      btn.addEventListener('click', (e) => { e.stopPropagation(); launch(btn, p); });
      dockEl.appendChild(btn);
    }
    // Sist: knapp som öppnar projektvyn.
    if (shown.length) {
      const sep = document.createElement('span');
      sep.className = 'dock-sep';
      dockEl.appendChild(sep);
    }
    const edit = document.createElement('button');
    edit.className = 'proj edit';
    edit.setAttribute('aria-label', 'Välj projekt');
    edit.innerHTML = '<span class="in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>';
    edit.addEventListener('mouseenter', () => showLabel(edit, { name: 'Välj projekt' }));
    edit.addEventListener('mouseleave', hideLabel);
    edit.addEventListener('click', (e) => {
      e.stopPropagation();
      hoverDock = false;
      openPicker();
    });
    dockEl.appendChild(edit);
    paint();
  }

  /* ================= projektvy ================= */
  let view = 'usage'; // 'usage' | 'picker'
  const DOCK_MAX = 8;

  function setView(v) {
    view = v;
    $('rows').hidden = v !== 'usage';
    $('picker').hidden = v !== 'picker';
    $('title').textContent = v === 'picker' ? 'Projekt i dockan' : 'Claude-förbrukning';
    $('refresh').hidden = v === 'picker';
    $('projects-btn').title = v === 'picker' ? 'Tillbaka till förbrukning' : 'Välj projekt i dockan';
    if (v === 'picker') {
      $('pick-search').value = '';
      renderPicker();
      setTimeout(() => $('pick-search').focus(), 120);
    } else {
      render();
    }
    if (isOpen) setTargets();
  }

  function openPicker() {
    loadProjects();
    open();
    setView('picker');
  }

  function renderPicker() {
    const list = $('pick-list');
    const q = $('pick-search').value.trim().toLowerCase();
    const n = projects.filter((p) => p.selected).length;
    $('meta').classList.remove('err');
    $('meta').textContent = `${n} av ${DOCK_MAX}`;
    $('meta').title = 'Valda projekt i dockan';
    list.textContent = '';
    const rows = projects.filter((p) => !q || p.name.toLowerCase().includes(q));
    if (!projects.length) {
      list.innerHTML = '<p class="pick-empty">Inga projekt hittades. Välj projektmapp via högerklick på ön.</p>';
    } else if (!rows.length) {
      list.innerHTML = '<p class="pick-empty">Inga projekt matchar sökningen.</p>';
    }
    for (const p of rows) {
      const full = !p.selected && n >= DOCK_MAX;
      const row = document.createElement('div');
      row.className = 'pick-row' + (p.selected ? ' on' : '') + (full ? ' disabled' : '');
      row.setAttribute('role', 'switch');
      row.setAttribute('aria-checked', String(!!p.selected));
      const tile = document.createElement('span');
      tile.className = 'tile';
      tile.appendChild(makeTile(p));
      const txt = document.createElement('div');
      txt.className = 'txt';
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = p.name;
      txt.appendChild(nm);
      if (p.kind && KIND[p.kind]) {
        const kd = document.createElement('div');
        kd.className = 'kd';
        kd.textContent = KIND[p.kind].label;
        txt.appendChild(kd);
      }
      const sw = document.createElement('span');
      sw.className = 'switch';
      row.append(tile, txt, sw);
      row.addEventListener('click', (e) => { e.stopPropagation(); if (!full) toggleProject(p); });
      list.appendChild(row);
    }
    $('pick-hint').textContent = n >= DOCK_MAX
      ? `Dockan rymmer ${DOCK_MAX} projekt. Slå av något för att välja ett annat.`
      : 'Valda projekt visas i dockan när du håller musen över ön.';
  }

  async function toggleProject(p) {
    p.selected = !p.selected;
    renderPicker();
    buildDock();
    await window.bridge.setSelected(projects.filter((x) => x.selected).map((x) => x.path));
    loadProjects.key = null;
  }

  $('pick-search').addEventListener('input', () => { renderPicker(); if (isOpen) setTargets(); });
  $('pick-search').addEventListener('click', (e) => e.stopPropagation());
  $('picker').addEventListener('click', (e) => e.stopPropagation());

  function showLabel(btn, p, text) {
    labelEl.textContent = text || p.name;
    if (!text && p.kind && KIND[p.kind]) {
      const s = document.createElement('span');
      s.textContent = ' · ' + KIND[p.kind].label;
      labelEl.appendChild(s);
    }
    const stage = $('stage').getBoundingClientRect();
    const r = btn.getBoundingClientRect();
    labelEl.style.left = (r.left + r.width / 2 - stage.left) + 'px';
    labelEl.classList.add('show');
  }
  function hideLabel() { labelEl.classList.remove('show'); }

  async function launch(btn, p) {
    btn.classList.remove('launching');
    void btn.offsetWidth;
    btn.classList.add('launching');
    showLabel(btn, p, `Öppnar ${p.name}…`);
    const ok = await window.bridge.openProject(p.path);
    if (!ok) showLabel(btn, p, 'Kunde inte öppna VS Code');
    setTimeout(() => { hoverDock = hoverIsland = false; hideDock(true); updateHover(); }, ok ? 700 : 1800);
  }

  async function loadProjects() {
    try {
      const list = await window.bridge.projects();
      const key = JSON.stringify(list.map((p) => [p.path, p.kind, !!p.icon, p.selected]));
      if (key !== loadProjects.key) {
        loadProjects.key = key;
        projects = list;
        buildDock();
        if (view === 'picker') renderPicker();
      }
    } catch {}
  }

  function showDock() {
    if (dockShown || isOpen || drag) return;
    dockShown = true;
    dockEl.classList.add('live');
    D.to = 1;
    kick();
  }
  function hideDock(now) {
    clearTimeout(showTimer);
    if (!dockShown) return;
    dockShown = false;
    dockEl.classList.remove('live');
    hideLabel();
    D.to = 0;
    kick();
    if (now) window.bridge.setIgnore(true);
  }

  // Gemensam hover för ön och dockan: dockan kommer fram efter en kort paus
  // (så den inte blinkar till när musen bara passerar), och dröjer kvar när
  // musen glider över mellanrummet mellan ön och dockan.
  function updateHover() {
    const any = hoverIsland || hoverDock;
    window.bridge.setIgnore(!any && !drag);
    hovering = hoverIsland;
    if (!isOpen) setTargets();
    clearTimeout(hideTimer);
    if (any) {
      if (!dockShown && !isOpen) {
        clearTimeout(showTimer);
        showTimer = setTimeout(() => { if (hoverIsland || hoverDock) showDock(); }, 220);
      }
    } else {
      clearTimeout(showTimer);
      hideTimer = setTimeout(() => { if (!hoverIsland && !hoverDock) hideDock(); }, 380);
    }
  }
  dockEl.addEventListener('mouseenter', () => { hoverDock = true; updateHover(); });
  dockEl.addEventListener('mouseleave', () => { hoverDock = false; hideLabel(); updateHover(); });

  loadProjects();
  setInterval(loadProjects, 60 * 1000);
  window.bridge.onProjectsChanged(() => { loadProjects.key = null; loadProjects(); });

  /* ================= lossad ö: dra för att flytta ================= */
  function setDetachedUI(on) {
    detached = on;
    islandEl.classList.toggle('detached', on);
  }
  window.bridge.isDetached().then(setDetachedUI);
  window.bridge.onDetached(setDetachedUI);

  islandEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || !detached || isOpen || e.target.closest('.icon-btn')) return;
    drag = { x: e.screenX, y: e.screenY, moved: false };
  });
  window.addEventListener('mousemove', (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return; // litet darr = klick, inte drag
    if (!drag.moved) { drag.moved = true; document.body.classList.add('dragging'); hideDock(); }
    drag.x = e.screenX; drag.y = e.screenY;
    window.bridge.dragBy(dx, dy);
  });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    if (drag.moved) { justDragged = true; window.bridge.dragEnd(); }
    drag = null;
    document.body.classList.remove('dragging');
    updateHover();
  });

  /* ================= interaktion ================= */
  function open() {
    if (isOpen) return;
    isOpen = true;
    hideDock();
    islandEl.classList.add('open');
    islandEl.setAttribute('aria-expanded', 'true');
    setTargets();
    load(false);
  }
  function close() {
    if (!isOpen) return;
    isOpen = false;
    if (view !== 'usage') setTimeout(() => { if (!isOpen) setView('usage'); }, 450);
    islandEl.classList.remove('open');
    islandEl.setAttribute('aria-expanded', 'false');
    setTargets();
  }

  islandEl.addEventListener('click', (e) => {
    if (e.target.closest('.icon-btn')) return;
    if (justDragged) { justDragged = false; return; }
    isOpen ? close() : open();
  });
  islandEl.addEventListener('contextmenu', (e) => { e.preventDefault(); window.bridge.menu(); });
  islandEl.addEventListener('mouseenter', () => { hoverIsland = true; loadProjects(); updateHover(); });
  islandEl.addEventListener('mouseleave', () => { hoverIsland = false; updateHover(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (view === 'picker') setView('usage'); else close();
  });
  $('projects-btn').addEventListener('click', () => {
    if (view === 'picker') setView('usage');
    else { loadProjects(); setView('picker'); }
  });

  $('refresh').addEventListener('click', () => load(true));
  $('minimize').addEventListener('click', () => window.bridge.minimize());

  async function load(force) {
    const btn = $('refresh');
    btn.classList.add('spin');
    try { state = await window.bridge.getUsage(force); }
    finally { btn.classList.remove('spin'); }
    render();
  }

  window.bridge.onUsage((p) => { state = p; render(); });
  window.bridge.onCollapse(() => {
    hovering = hoverIsland = hoverDock = false;
    hideDock();
    close();
    if (!isOpen) setTargets();
  });

  // Håll nedräkningarna färska utan nya API-anrop.
  setInterval(() => { if (state) render(); }, 30000);

  paint();
  load(true);
</script>
</body>
</html>
